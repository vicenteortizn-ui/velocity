name: Compilar APK Velocity

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear el proyecto Android
        run: |
          set -e
          test -f index.html || { echo "Falta el archivo index.html en la raiz del repositorio"; exit 1; }
          mkdir -p app/src/main/java/com/velocity/app app/src/main/assets
          cp index.html app/src/main/assets/index.html
          echo "" | base64 -d > app/velocity.keystore

          cat > settings.gradle <<'VELOCITY_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Velocity'
          include ':app'
          VELOCITY_EOF

          cat > build.gradle <<'VELOCITY_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          VELOCITY_EOF

          cat > gradle.properties <<'VELOCITY_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          VELOCITY_EOF

          cat > app/build.gradle <<'VELOCITY_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.velocity.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.velocity.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              signingConfigs {
                  velocity {
                      storeFile file('velocity.keystore')
                      storePassword 'velocity123'
                      keyAlias 'velocity'
                      keyPassword 'velocity123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.velocity
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          VELOCITY_EOF

          cat > app/src/main/AndroidManifest.xml <<'VELOCITY_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="Velocity"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          VELOCITY_EOF

          cat > app/src/main/java/com/velocity/app/MainActivity.java <<'VELOCITY_EOF'
          package com.velocity.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_CAMERA = 1;
              private static final int REQ_FILE = 2;

              private WebView web;
              private PermissionRequest pendingRequest;
              private ValueCallback<Uri[]> fileCallback;

              /* Puente para guardar PDF y videos en la carpeta Descargas */
              private class Bridge {
                  @JavascriptInterface
                  public void saveFile(String name, String mime, String base64) {
                      String message;
                      try {
                          String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                          String type = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime.split(";")[0];
                          byte[] data = Base64.decode(base64, Base64.DEFAULT);
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                          values.put(MediaStore.Downloads.MIME_TYPE, type);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new Exception("sin destino");
                          OutputStream out = getContentResolver().openOutputStream(uri);
                          if (out == null) throw new Exception("sin salida");
                          out.write(data);
                          out.close();
                          message = "Guardado en Descargas: " + safe;
                      } catch (Exception e) {
                          message = "No se pudo guardar el archivo";
                      }
                      final String finalMessage = message;
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, finalMessage, Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(request.getResources());
                                  } else {
                                      pendingRequest = request;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                                  }
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_CAMERA && pendingRequest != null) {
                      boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (ok) pendingRequest.grant(pendingRequest.getResources());
                      else pendingRequest.deny();
                      pendingRequest = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          VELOCITY_EOF


      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK y codigo QR
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk velocity.apk
          pip install "qrcode[pil]"
          URL="https://github.com/${{ github.repository }}/releases/latest/download/velocity.apk"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1]).save('qr.png')" "$URL"
          echo "Enlace de descarga: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" velocity.apk qr.png \
            --title "Velocity v${{ github.run_number }}" \
            --notes "Descarga velocity.apk en el celular e instalalo. Tambien puedes escanear qr.png." \
            --latest
